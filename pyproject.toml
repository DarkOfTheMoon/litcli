[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litcli"
dynamic = ["version"]
description = "通用学术 CLI:后端无关的领域库 + 可插拔多后端(本机 Zotero / arXiv / Crossref / OpenAlex / 中文题录与图书)互操作"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27",   # transport: pooling, HTTP/2, proxy, explicit timeouts
  "tenacity>=8.2",        # retry policy for 429/5xx/transport errors
  "pyrate-limiter>=3",    # per-site request pacing
  "lxml>=5",              # HTML/XML parsing
]
authors = [{ name = "ZhangHuiJie" }]
keywords = ["zotero", "arxiv", "academic", "cli", "csl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Browser-driven backends (install.sh --with-cnki / --with-douban installs these too).
cnki = ["playwright>=1.40", "jieba>=0.42"]   # jieba: splits concatenated Chinese keywords
douban = ["playwright>=1.40"]

[project.urls]
Homepage = "https://gitee.com/simult/litcli"
Repository = "https://gitee.com/simult/litcli"
Issues = "https://gitee.com/simult/litcli/issues"

[project.scripts]
litcli = "litcli.cli:main"

[tool.setuptools.dynamic]
version = {attr = "litcli._version.__version__"}

[tool.setuptools]
packages = ["litcli", "litcli.backends", "litcli.commands"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
src = ["litcli", "tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle + bugbear + pyupgrade + simplify + ruff-specific. Deliberately narrower
# than `ALL`: the flake8-* plugin sets (FURB, PL, S…) are noisy here and buy little.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese fullwidth punctuation in message strings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["litcli"]
