name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff, configured in pyproject.toml)
        run: |
          pip install ruff
          ruff check litcli tests
      # Install builds the package from pyproject (verifies packaging metadata + console entry point).
      # jieba is the optional `[cnki]` extra's splitter; the cnki query tests need it present.
      - name: Install package
        run: pip install . jieba
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test console entry point
        run: litcli --version

  windows:
    # Pins the Windows-specific behaviour: %APPDATA% config, save names free of <>:"/\|?*,
    # and UTF-8 on redirected streams.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install . jieba
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the console entry point and save names
        run: |
          litcli --version
          litcli fetch --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Releases ship an sdist + a wheel built exactly this way; a broken build must fail CI.
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
