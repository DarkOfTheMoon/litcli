name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff, configured in pyproject.toml)
        run: |
          pip install ruff
          ruff check litcli tests
      # Install builds the package from pyproject (verifies packaging metadata + console entry point).
      # jieba is the optional `[cnki]` extra's splitter; the cnki query tests need it present.
      - name: Install package
        run: pip install . jieba
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test console entry point
        run: litcli --version

  windows:
    # Pins the Windows-specific behaviour: %APPDATA% config, save names free of <>:"/\|?*,
    # and UTF-8 on redirected streams.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install . jieba
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the console entry point and save names
        run: |
          litcli --version
          litcli fetch --help

  binary:
    # The installer users actually download: a frozen tree (bytecode + shared objects, no .py)
    # wrapped in a self-extracting file. Both builds verify themselves in place — freeze,
    # install silently, run --version and a real search, uninstall, assert the tree is gone.
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup (Windows installer compiler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Build the installer
        if: runner.os == 'Linux'
        run: sh scripts/build_binary.sh
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_binary.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/bin/*
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Releases ship an sdist + a wheel built exactly this way; a broken build must fail CI.
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
