# litcli 配置示例(复制到 ~/.config/litcli/config.toml)
# 任一缺省时回退到内置默认:本机 Zotero + arXiv(开箱即用,无需本文件)。

[backends.zotero]
type = "zotero_local"
base = "http://localhost:23119/api"      # 本机 Zotero 10 本地 API
# 写(POST/PATCH/DELETE)需真实 Zotero API key;localhost key 仅为只读。
# path: Zotero → 偏好设置 → Advanced → API keys → 生成。缺省时写请求返回 401。
# api_key = "你的-zotero-api-key"

[backends.arxiv]
type = "arxiv"                          # 联网,只读,无需 key

# 可选:开放图书数据库(书籍元数据)。默认不内置;需要时取消注释启用。
# 部分网络环境对 openlibrary.org / googleapis.com 无路由,若搜图书无响应请自查连通性。
[backends.openlibrary]
type = "openlibrary"

# 可选:专利检索(USPTO 开放数据,key 门控)。免费注册 key:
# https://developer.uspto.gov 顶部 "Get a developer key"。
# 免 key 可达的 Crossref/OpenAlex 公开版专利记录趋近 0,专利检索以本后端为主通道;
# 不填 api_key 时 search/get 会明确提示,而非静默失败。
[backends.uspto]
type = "uspto"
# api_key = "你的-uspto-api-key"

# 可选:统一代理(校园/VPN 访问海外学术源)。留空则默认读环境变量 HTTP_PROXY / HTTPS_PROXY。
[network]
# proxy = "http://127.0.0.1:7890"
