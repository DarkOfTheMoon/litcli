# litcli 配置示例(复制到 ~/.config/litcli/config.toml)
# 任一缺省时回退到内置默认:本机 Zotero + arXiv + Crossref + OpenAlex(开箱即用,无需本文件)。
# 下列 [backends.*] 段用于显式覆盖默认 / 启用可选后端(openlibrary / uspto)。

[backends.zotero]
type = "zotero_local"
base = "http://localhost:23119/api"      # 本机 Zotero 10 本地 API
# 写(POST/PATCH/DELETE)需 Zotero 本地授权 key。运行 `litcli backends authorize zotero`,
# 在 Zotero 本地弹框批准后,key 会自动写入下一行。无需手动从偏好设置生成(Zotero 10
# 本地 API 走运行时授权派发,非 zotero.org 的 Web API key)。
# api_key = "本地授权-key(由 backends authorize 写入,通常无需手填)"

[backends.arxiv]
type = "arxiv"                          # 联网,只读,无需 key
# arXiv 开放 API 按 IP 限速,短时间连发会返回 HTTP 429 "Rate exceeded."(litcli 已按 2s/4s
# 退避重试并给出明确提示)。填一个可联系邮箱可降低被限速概率;仅建议,无需真校验。
# mailto = "you@example.com"

[backends.crossref]
type = "crossref"                       # 内置默认,无需 key

[backends.openalex]
type = "openalex"                       # 内置默认,无需 key
# OpenAlex polite pool:库是免费城域,填一个可联系的邮箱可提升稳定/速率上限。
# 开着即可(无需真校验);请求以 ~10 req/s 限速,并随每请求附 mailto 参数。
# mailto = "you@example.com"

# 可选:开放图书数据库(书籍元数据)。默认不内置;需要时取消注释启用。
# 部分网络环境对 openlibrary.org / googleapis.com 无路由,若搜图书无响应请自查连通性。
[backends.openlibrary]
type = "openlibrary"

# 可选:专利检索(USPTO 开放数据,key 门控)。免费注册 key:
# https://developer.uspto.gov 顶部 "Get a developer key"。
# 免 key 可达的 Crossref/OpenAlex 公开版专利记录趋近 0,专利检索以本后端为主通道;
# 不填 api_key 时 search/get 会明确提示,而非静默失败。
[backends.uspto]
type = "uspto"
# api_key = "你的-uspto-api-key"

# 可选:CNKI(知网)中文题录检索(需 Playwright + 可见浏览器,人工过滑块,只取公开题录不抓全文)。
# 默认不内置;取消注释 + 在 install.sh 用 --with-cnki 装 playwright 后才可用。
[backends.cnki]
type = "cnki"
# user_data_dir = "~/.config/litcli/cnki-chrome"   # 独立浏览器 profile,会话在此持久化(首次人工登录一次)
# headless = false                                  # 必须可见(知网对无头访问弹滑块验证码,需人工滑动)

# 可选:豆瓣图书(公开书目检索,需 Playwright)。默认不内置;取消注释 + install.sh --with-douban 装 playwright 可用。
# 无公开 API(api.douban.com v2 需 key),靠浏览器渲染 search 页的 window.__DATA__ 拿书卡;只取公开书目元数据
# (书名/作者/出版社/ISBN/出版年/页数/评分),不抓受限内容、不绕过反爬。headless 默认 true(豆瓣 SSR 直接给 JSON,
# 无滑块);仅当被风控(检测到异常流量)才在可见浏览器人工处理。
[backends.douban]
type = "douban"
# user_data_dir = "~/.config/litcli/douban-chrome"  # 独立浏览器 profile(默认仅用于偶发登录/cookie 持久化)
# headless = true                                   # 默认无头;豆瓣无需人工滑验证码,仅风控时降级

# 可选:统一代理(校园/VPN 访问海外学术源)。留空则默认读环境变量 HTTP_PROXY / HTTPS_PROXY。
[network]
# proxy = "http://127.0.0.1:7890"
