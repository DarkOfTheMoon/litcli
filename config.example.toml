# litcli 配置示例(复制到 ~/.config/litcli/config.toml;Windows 为 %APPDATA%\litcli\config.toml)。
# 文件存在就**整体以文件为准**;只有文件不存在时才用内置默认(本机 Zotero + arXiv + Crossref + OpenAlex)。
# 所以复制本文件 = 启用下面全部后端:openlibrary、uspto、cnki、douban、sciencedirect、wiley、springer、cambridge、aip、
# acm、aps、iop、tandf、aiaa、ieee、scihub、zlibrary 与四个开放获取源(doaj / europepmc / doab / zenodo);不想用的段整段删掉。

[backends.zotero]
type = "zotero_local"
base = "http://localhost:23119/api"      # 本机 Zotero 10 本地 API
# 写(POST/PATCH/DELETE)需 Zotero 本地授权 key。运行 `litcli backends authorize zotero`,
# 在 Zotero 本地弹框批准后,key 会自动写入下一行。无需手动从偏好设置生成(Zotero 10
# 本地 API 走运行时授权派发,非 zotero.org 的 Web API key)。
# api_key = "本地授权-key(由 backends authorize 写入,通常无需手填)"

[backends.arxiv]
type = "arxiv"                          # 联网,只读,无需 key
# arXiv 开放 API 按 IP 限速,短时间连发会返回 HTTP 429 "Rate exceeded."(litcli 已按指数退避重试,
# 至多 3 次,再失败给明确提示)。填一个可联系邮箱可降低被限速概率;仅建议,无需真校验。
# mailto = "you@example.com"

[backends.crossref]
type = "crossref"                       # 内置默认,无需 key

[backends.openalex]
type = "openalex"                       # 内置默认,无需 key
# OpenAlex polite pool:库免费、限流很宽,填一个可联系的邮箱可进一步提升速率上限。
# 开着即可(无需真校验);请求以 ~10 req/s 限速,并随每请求附 mailto 参数。
# mailto = "you@example.com"

# 开放图书数据库(书籍元数据)。默认不内置,但本文件里是启用的;不想用就删掉本段。
# 部分网络环境对 openlibrary.org / googleapis.com 无路由,若搜图书无响应请自查连通性。
[backends.openlibrary]
type = "openlibrary"

# 可选:专利检索(USPTO 开放数据,key 门控)。免费注册 key:
# https://developer.uspto.gov 顶部 "Get a developer key"。
# 免 key 可达的 Crossref/OpenAlex 公开版专利记录趋近 0,专利检索以本后端为主通道;
# 不填 api_key 时 search/get 会明确提示,而非静默失败。
[backends.uspto]
type = "uspto"
# api_key = "你的-uspto-api-key"

# CNKI(知网)中文题录检索(需 Playwright + 可见浏览器,人工过滑块,只取公开题录不抓全文)。
# 默认不内置,但本文件里是启用的;另需 install.sh --with-cnki 装 playwright。
[backends.cnki]
type = "cnki"
# user_data_dir = "~/.config/litcli/cnki-chrome"   # 独立浏览器 profile,会话在此持久化(首次人工登录一次);Windows 默认在 %APPDATA%\litcli\cnki-chrome
# headless = false                                  # 必须可见(知网对无头访问弹滑块验证码,需人工滑动)

# 豆瓣图书(公开书目检索,需 Playwright)。默认不内置,但本文件里是启用的;另需 install.sh --with-douban 装 playwright。
# 无公开 API(api.douban.com v2 需 key),靠浏览器渲染 search 页的 window.__DATA__ 拿书卡;只取公开书目元数据
# (书名/作者/出版社/ISBN/出版年/页数/评分),不抓受限内容、不绕过反爬。headless 默认 true(豆瓣 SSR 直接给 JSON,
# 无滑块);仅当被风控(检测到异常流量)才在可见浏览器人工处理。
[backends.douban]
type = "douban"
# user_data_dir = "~/.config/litcli/douban-chrome"  # 独立浏览器 profile(默认仅用于偶发登录/cookie 持久化);Windows 默认在 %APPDATA%\litcli\douban-chrome
# headless = true                                   # 默认无头;豆瓣无需人工滑验证码,仅风控时降级

# 可选:ScienceDirect 文章读取(出版社站点,无需 key,只按 DOI / PII / 文章 URL 解析,无关键词检索)。
# 不登录也能取到题录,但 PDF 只在**有权限的会话**下给出(机构 IP、校园网或已登录),匿名访问会拿到
# CPE00001 拦截页并明确提示。它排在 OA 全文链之后,非 OA 授权,命中标注为机构访问副本。
# 机构 IP 不够时,在用已认证(机构登录)的浏览器标签里打开一次文章、把该会话的 Cookie 贴进来(或指向导出的 cookies.txt)。
# cookie 与 user_agent 必须成对给:cookie 单独配置会直接报错(清关 Cookie 绑 UA + 出口 IP,寿命分钟~小时级,
# 换机器回放即失效)。未认证的标签页只会给 "Purchase PDF",且 /pii/ 会被静默改写成 /abs/。
# PDF 本身另有一道 Elsevier 验收关(craft/challenge/pdf),页面通了也不一定直取;被拦时 fetch 会报因并给出
# 链接,在已授权的浏览器里打开即可。
[backends.sciencedirect]
type = "sciencedirect"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/sciencedirect-cookies.txt"   # 或 Netscape cookies.txt 路径
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent;Cloudflare 清关 Cookie 与 UA 绑定,须一致)"
# timeout = 30

# 可选:Wiley Online Library 文章读取(出版社站点,无需 key,只按 DOI / 文章 URL 解析,无关键词检索)。
# 与 ScienceDirect 同型:Cloudflare 托管挑战 + 按会话判权限。同样需要**已认证**会话的
# cookie + user_agent 成对配置(绑 UA+出口 IP,服务端随时可能失效);未获授权时链继续往下,不阻断。
# 未订阅的会话会被 PDF 端点静默跳到摘要页,litcli 会在取不到字节时明说。
# 更省事的是 TDM token(api.wiley.com,不经过 Cloudflare,直连下载):在 Wiley 站点登录后于
# https://onlinelibrary.wiley.com/library-info/resources/text-and-datamining 申请(免费)。
# 它只放行你机构已订阅的文章(否则 403,litcli 会明说)。只配 token 也能下载:页面被挑战拦下时
# 该次题录留空,但下载照走 TDM,不再因此丢掉整篇文章。
[backends.wiley]
type = "wiley"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/wiley-cookies.txt"   # 或 Netscape cookies.txt 路径
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent)"
# tdm_token = "…(Wiley TDM Client Token;配置后 PDF 走 api.wiley.com,优先于页面路径)"
# delay = 10.0        # 请求间隔(秒);Wiley 限 3 篇/秒且 60 请求/10 分钟
# timeout = 30

# 可选:SpringerLink 文章读取(Springer Nature,无需 key,只按 DOI / 文章 URL 解析,无关键词检索)。
# 与 ScienceDirect / Wiley 不同,**没有 Cloudflare**:文章页匿名就能读、题录与 citation_pdf_url
# 恒在,金 OA 的 PDF 匿名也能下载。需要会话的只有付费文章的 PDF——它的端点会先 303 到
# idp.springer.com 换身份 cookie,未订阅会话最后落回文章页(静默降级),litcli 会明说。
# 订阅文章需把**已认证**会话的 cookie + user_agent 成对配进来(会话绑 UA;过期就重取)。
[backends.springer]
type = "springer"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/springer-cookies.txt"   # 或 Netscape cookies.txt 路径
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent)"
# delay = 1.0         # 请求间隔(秒)
# timeout = 30

# 可选:Cambridge Core 文章/章节读取(剑桥大学出版社,无需 key,只按 DOI / 页面 URL 解析,无关键词检索)。
# 与 Springer 相近:**没有 Cloudflare**,页面匿名就能读、citation_* 题录与 citation_pdf_url 恒在,
# **CC 许可的 OA 文章 PDF 匿名直取 %PDF**。付费条目经 doi.org 只落到 /abs/ 短页,其 PDF 端点会把
# 匿名客户端 302 回条目页(HTML,静默降级),litcli 据此明说"未获授权"。
# 订阅条目需把**已认证**会话的 cookie + user_agent 成对配进来(会话绑 UA;过期就重取)。
[backends.cambridge]
type = "cambridge"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/cambridge-cookies.txt"  # 或 Netscape cookies.txt 路径
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent)"
# delay = 1.0         # 请求间隔(秒)
# timeout = 30

# 可选:AIP Publishing 文章读取(pubs.aip.org,无需 key,只按 DOI / 页面 URL 解析,无关键词检索)。
# 与 Cambridge 不同,**站点在 Cloudflare 托管挑战后面**:文章页与 PDF 端点对裸 HTTP 客户端
# 一律 403 + `cf-mitigated: challenge`(Just a moment…),所以匿名基本取不到东西——必须把
# **已清关**浏览器会话的 cookie + user_agent 成对配进来(cf_clearance 同时绑 UA 与出口 IP,
# 过期就重取)。未配会话时 litcli 报的就是这道门,不是 IP 被封。
[backends.aip]
type = "aip"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/aip-cookies.txt"       # 或 Netscape cookies.txt 路径
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent)"
# delay = 1.0         # 请求间隔(秒)
# timeout = 30

# 可选:以下六家同为「订阅全文、只按 DOI / 页面 URL 解析、无关键词检索」的出版社阅读器。
# 与 AIP 一样**全部在机器人闸后面**（ACM/APS/IOP/Taylor & Francis/AIAA 是 Cloudflare 托管挑战,
# IEEE Xplore 是 WAF 挑战),页面与 PDF 端点对裸客户端一律 403/202,未配已清关的 cookie +
# user_agent 基本取不到;OA 条目同样先过闸,配了会话后可直接下。doi.org 上的假 DOI 一律
# 404,可直接验证连通。清关 cookie 是 HttpOnly,手抄 Cookie 头容易漏:更稳的是把浏览器导出
# 的 Netscape cookies.txt 原样指给 cookie_file(导出里的 #HttpOnly_ 行会被读),user_agent 仍
# 须配同源浏览器的值。
[backends.acm]
type = "acm"
# cookie = "…(浏览器 Cookie 头,原样粘贴)"
# cookie_file = "~/.config/litcli/acm-cookies.txt"
# user_agent = "…(与 Cookie 同源浏览器的 User-Agent)"

[backends.aps]
type = "aps"
# cookie_file = "~/.config/litcli/aps-cookies.txt"
# user_agent = "…"

[backends.iop]
type = "iop"
# cookie_file = "~/.config/litcli/iop-cookies.txt"
# user_agent = "…"

[backends.tandf]
type = "tandf"
# cookie_file = "~/.config/litcli/tandf-cookies.txt"
# user_agent = "…"

[backends.aiaa]
type = "aiaa"
# cookie_file = "~/.config/litcli/aiaa-cookies.txt"
# user_agent = "…"

[backends.ieee]
type = "ieee"
# cookie_file = "~/.config/litcli/ieee-cookies.txt"
# user_agent = "…"

# 可选:Sci-Hub 全文兜底(盗版镜像,只按 DOI 解析 PDF,无关键词检索)。
# 默认不内置,但本文件里是启用的(复制本文件即启用)。启用后 `fetch` 会在链末再试 Sci-Hub,
# 并标注来源。也可只在单次调用加 `--scihub`,不改配置。
# 站点用 ALTCHA 工作量证明验人,litcli 用本地 hashlib 解同一道题(不绕过),每次调用一个 DOI。
[backends.scihub]
type = "scihub"
# 镜像按序尝试;这三条就是代码内置的 _DEFAULT_MIRRORS,失效的自行替换。
mirrors = ["sci-hub.ru", "sci-hub.st", "sci-hub.se"]
# timeout = 30

# 可选:Z-Library 图书检索 + 下载(影子图书馆,非 OA 授权)。默认不内置。
# 页面是服务端渲染的,无需 Playwright;用前会先过站点的
# “Checking your browser” 工作量证明(litcli 本地 hashlib 解,不绕过)。入口域名会轮换,
# 故只配入口 base,真实前端主机从 302 自动解析。匿名每日下载有配额,超限报错提示。
[backends.zlibrary]
type = "zlibrary"
# base = "https://z-library.by"                    # 入口域名;也可直接填当前前端主机
# mirrors = ["z-library.by", "zh.pirate101.ru"]    # 入口按序尝试;首项是内置默认(仅此一条),备用镜像自行加
# email = "you@example.com"                        # 可选:登录后放宽匿名每日下载配额
# password = "***"
# delay = 1.0                                      # 请求间隔(秒),人机节律
# timeout = 40

# 开放获取(OA)语料源。均免 key、只读、只含开放授权记录。它们**无需配置**就参与
# `search`(不写 --backend 时的全量扇出,含 --all)与 `fetch` 的合法 OA 全文链
# (Unpaywall → OpenAlex → Europe PMC XML → Zenodo 文件)。下面几段用于覆盖默认参数
# (如节律),不写也一样能搜到;想彻底排除某个源才需要 `enabled = false`。
[backends.doaj]                    # DOAJ 开放获取期刊论文索引(全是 OA)
type = "doaj"
# enabled = false                  # 反注释即从 search / fetch 的全量扇出里彻底排除本源(其余源不受影响)
[backends.europepmc]               # Europe PMC 生物医学题录 + 开放获取 JATS 全文
type = "europepmc"
# delay = 0.4                      # EBI 建议 ≤3 req/s
[backends.doab]                    # DOAB 开放获取图书(检索走 Atom feed;详情页有“你不是机器人”工作量证明,litcli 本地解)
type = "doab"
[backends.zenodo]                  # Zenodo 开放数据集/软件/预印本(文件可直接下载)
type = "zenodo"

# 可选:统一代理(校园/VPN 访问海外学术源)。留空则默认读环境变量 HTTP_PROXY / HTTPS_PROXY。
[network]
# proxy = "http://127.0.0.1:7890"
